[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghent-water-frontend"
version = "0.1.0"
description = "Streamlit frontend for the Ghent Water System Explorer"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.15.0",
    "httpx>=0.25.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghent_water/frontend"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
