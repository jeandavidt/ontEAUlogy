[project]
name = "ghent-water"
version = "0.1.0"
description = "FastAPI orchestrator for Ghent water system ontology"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "rdflib>=7.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghent_water"]
