[project]
name = "ghent-water"
version = "0.1.0"
description = "FastAPI orchestrator for Ghent water system ontology"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "rdflib>=7.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "pydantic-ai>=0.2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "altair>=6.0.0",
    "pyvis>=0.3.0",
    "networkx>=3.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghent_water"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
