x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile.model
  networks:
    - ghent-water-network
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 128M

services:
  # React Frontend (unchanged)
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ghent-frontend-react
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - ghent-water-network
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - full
      - frontend

  # CORE ORCHESTRATOR (using shared image with build)
  orchestrator:
    build:
      context: ../..
      dockerfile: case_studies/core/orchestrator/Dockerfile
    image: onteaulogy-core:latest
    container_name: ghent-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount the shared ontology data
      - ../../data:/shared-ontology:ro
      # Mount case study specific data
      - ./data:/app/data:ro
      # Mount the configuration file
      - ./config/orchestrator.yaml:/app/config.yaml:ro
    command: ["onteaulogy-orchestrator", "/app/config.yaml"]
    networks:
      - ghent-water-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8080/health', timeout=5).status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - full
      - backend

  # Model Services (unchanged from original)
  dwp1:
    <<: *common-config
    container_name: ghent-dwp1
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MODEL_NAME=dwp1
    command: ["python", "-m", "ghent_water.models.runners.model_runner", "--model", "dwp1", "--port", "8001"]
    profiles:
      - full
      - models
      - backend

  dwp2:
    <<: *common-config
    container_name: ghent-dwp2
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MODEL_NAME=dwp2
