  # Observability Stack - Loki for log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: ghent-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ghent-water-network
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  # Promtail - Log shipper
  promtail:
    image: grafana/promtail:2.9.3
    container_name: ghent-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - ghent-water-network
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: ghent-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ghent-water-network
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: ghent-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - ghent-water-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: ghent-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ghent-water-network
    restart: unless-stopped
    privileged: true
    profiles:
      - full
      - monitoring

# Network configuration
networks:
  ghent-water-network:
    driver: bridge
    labels:
      - "com.ghent-water.network=main"

# Volumes for persistent storage
volumes:
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
