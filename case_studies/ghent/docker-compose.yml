
x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile.model
  networks:
    - ghent-water-network
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 128M

services:
  # React Frontend
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ghent-frontend-react
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - ghent-water-network
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.ghent-water.service=frontend"
      - "com.ghent-water.environment=${ENVIRONMENT:-development}"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    profiles:
      - full
      - frontend

  # Orchestrator
  orchestrator:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: ghent-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ONTOLOGY_BASE_PATH=/shared-ontology
    volumes:
      - ../../data:/shared-ontology:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8080/health', timeout=2).status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.ghent-water.service=orchestrator"
      - "com.ghent-water.environment=${ENVIRONMENT:-development}"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    profiles:
      - full
      - backend

  # Model Services
  dwp1:
    <<: *common-config
    container_name: ghent-dwp1
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MODEL_NAME=dwp1
      - ENVIRONMENT=${ENVIRONMENT:-development}
    command: ["python", "-m", "ghent_water.models.runners.model_runner", "--model", "dwp1", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8001/health', timeout=2).status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.ghent-water.service=model"
      - "com.ghent-water.model=dwp1"
      - "com.ghent-water.environment=${ENVIRONMENT:-development}"
    profiles:
      - full
      - models
      - backend

