server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_ghent_water_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_ghent_water_model']
        target_label: 'model'
      - source_labels: ['__meta_docker_container_label_com_ghent_water_environment']
        target_label: 'environment'
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            logger: logger
      # Extract log level
      - labels:
          level:
          logger:
      # Parse timestamps
      - timestamp:
          source: timestamp
          format: RFC3339Nano
