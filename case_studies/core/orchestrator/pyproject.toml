[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontEAUlogy-core"
version = "0.1.0"
description = "Core orchestrator for ontEAUlogy case studies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ontEAUlogy Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-yaml>=1.0.0",
    "pydantic-ai>=0.0.50",
    "python-dotenv>=1.0.0",
    "rdflib>=7.0.0",
    "openai>=1.0.0",
    "ontEAUlogy-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
onteaulogy-orchestrator = "ontEAUlogy_core.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ontEAUlogy_core"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
