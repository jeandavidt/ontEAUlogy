[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "household-water"
version = "0.1.0"
description = "Household decentralised water reuse model services (MBR, RO, Infiltration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "rdflib>=7.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
# qsdsan requires numba→llvmlite (Python <3.13 only). Models use analytical
# implementations; qsdsan integration deferred (see MISSING_CONCEPTS.md Gap INF-02).
qsdsan = ["qsdsan>=1.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/household_water"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
