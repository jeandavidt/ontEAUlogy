[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waterframe-core"
version = "0.1.0"
description = "Reusable orchestrator components for ontEAUlogy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "rdflib>=7.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["waterframe_core"]
